# UrbanPulse Server Configuration
server.port=8080
server.address=0.0.0.0
spring.application.name=UrbanPulse

# PostgreSQL Datasource Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/urbanpulse
spring.datasource.username=postgres
spring.datasource.password=root123

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

firebase.credentials.path=urbanpulse-firebase-admin.json
# Multipart File Upload Configuration (allow physical camera photos up to 25MB)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
